services:
  metabase:
    build: .
    container_name: metabase-duckdb
    ports:
      - "3000:3000"
    environment:
      MB_PLUGINS_DIR: /plugins
      # Metadata Metabase sendiri (dashboard, user, dll) disimpan di H2
      # di dalam volume terpisah supaya tidak hilang saat container dibuat ulang.
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      # File DuckDB warehouse Anda, di-mount READ-ONLY (:ro).
      # Ini penting: mencegah Metabase mengunci/menulis file yang sama
      # dengan pipeline ETL Anda. Sesuaikan path kiri kalau file .duckdb
      # Anda tidak berada di folder yang sama dengan docker-compose.yml.
      - ./transtats_dw.duckdb:/data/transtats_dw.duckdb:ro
      - metabase-data:/metabase-data

volumes:
  metabase-data: